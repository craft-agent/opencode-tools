name: opencode-tools
version: 0.0.0
description: "OpenCode tools for coding agents: start, follow, steer and answer sessions from another harness."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - opencode_grant_create
  - opencode_grant_read
  - opencode_grant_revoke
  - opencode_request_read
  - opencode_run_read
  - opencode_run_start
  - opencode_run_start_write
  - opencode_service_read
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of toolset names, or "all". Defaults to the package''s default toolsets.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  unattended:
    type: bool
    description: "No person can answer: writes run only under a grant that covers them."
  grants_dir:
    type: str
    description: Where grants and their use are kept; default under the user's state directory.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
  roles:
    type: dict
    description: 'The roles a run can start under, by name: each an agent and a policy ("read-only" or "write"), with an optional model and note. Defaults to plan and build, OpenCode''s own agents.'
  wait_seconds:
    type: int
    description: How many seconds one call may take as a whole, a wait included; 1 to 3300. Defaults to 50.
  note:
    type: str
    description: Text added to what every run is told.
  rules:
    type: dict
    description: 'Permission rules of your own for a run, by policy ("read-only" or "write"): each a list of rules with an action, a resource and an effect (allow, deny or ask).'
  never_approve:
    type: list
    description: 'Action patterns a run''s permission request for which can only be rejected; "*" stands for any text.'
  read_roots:
    type: list
    description: Directories a read-only run may read outside its worktree, as absolute paths.
  protected_dirs:
    type: list
    description: Checkouts no write run may start in, as absolute paths.
  language:
    description: The language of the approval card, such as ja. Defaults to Hermes's display language, else English.
  require_plugins:
    type: list
    description: The Hermes plugins that must be loaded; while one is not, every write is refused before it is approved.
  emoji:
    type: dict
    description: 'The emoji shown beside each toolset, by toolset name; "" shows none. Merged over the package''s emoji.'
